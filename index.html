<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Gifting Enquiry</title>
<style>
:root{--red:#b3122e;--gold:#d4a017;--bg:#fff8ec;--text:#2b2b2b;}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:#fff;border-top:6px solid var(--red);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding:24px;width:100%;max-width:380px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 4px;color:var(--red)}
.sub{font-size:13px;color:#666;margin-bottom:20px}
label{display:block;font-size:14px;margin-bottom:6px;font-weight:600}
input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-bottom:16px}
button{width:100%;padding:14px;font-size:16px;background:var(--red);color:#fff;border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6}
.msg{font-size:14px;padding:10px;border-radius:8px;margin-bottom:16px;display:none}
.err{background:#fde8ec;color:#8a0c22;display:block}
.ok{background:#e8f7ec;color:#1d6b33;display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Diwali Gifting Enquiry</h1>
  <div class="sub">Vishal Mega Mart · Store login</div>
  <div id="msg" class="msg"></div>
  <form id="loginForm" autocomplete="off">
    <label for="storeCode">Store code</label>
    <input id="storeCode" maxlength="10" required autocapitalize="characters">
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" required>
    <button id="btn" type="submit">Login</button>
  </form>
</div>
<script>
const SUPABASE_URL = "https://hibjphthtkpckbgdqwad.supabase.co";
const SUPABASE_KEY = "sb_publishable_rtdt7c1Dhs9dAUUHkKWXKw_3CSbh0Hj";
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
function show(text, type){ msg.textContent = text; msg.className = "msg " + type; }
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = document.getElementById("storeCode").value.trim().toUpperCase();
  const pin = document.getElementById("pin").value.trim();
  if(!/^[A-Z0-9]{2,10}$/.test(code) || !/^[0-9]{4,6}$/.test(pin)){
    show("Enter a valid store code and a 4–6 digit PIN.", "err"); return;
  }
  btn.disabled = true; show("Checking…", "ok");
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/verify_store_pin", {
      method: "POST",
      headers: {"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
      body: JSON.stringify({p_store_code: code, p_pin: pin})
    });
    const data = await res.json();
    if(data.ok){
      show("Welcome, " + data.store_name + " (" + data.store_code + ")", "ok");
    } else if(data.error === "locked"){
      show("Too many wrong attempts. Try again after 15 minutes.", "err");
    } else {
      show("Access denied. Check your store code and PIN.", "err");
    }
  }catch(err){
    show("Network error. Check your connection and try again.", "err");
  }finally{ btn.disabled = false; }
});
</script>
</body>
</html>
